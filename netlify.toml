# Netlify deployment configuration for AVH Store (Next.js 16).
#
# This file is intentionally MINIMAL — Netlify's Next.js runtime plugin
# auto-detects the framework and bundles each route + API handler as an
# individual serverless function. We only configure:
#   1. The build command (generates Prisma Client + z-ai config + builds Next.js)
#   2. Node version (LTS — matches the local dev environment)
#   3. Secrets scanning exemption for ZAI_API_KEY + ZAI_BASE_URL
#      (these are placeholder values until the operator sets real keys
#      from the z.ai dashboard — `Z.ai` is NOT a real secret, it's the
#      placeholder default in /etc/.z-ai-config)
#
# SECRETS (DATABASE_URL, NEXTAUTH_SECRET, GOOGLE_CLIENT_SECRET, etc.) are
# set in the Netlify dashboard (Site → Settings → Environment variables)
# and are NOT committed here.

[build]
  command = "node scripts/setup-zai-config.js && bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # bun is auto-detected; if you prefer npm/pnpm, override here.
  #
  # SECRETS SCANNING:
  # ZAI_API_KEY and ZAI_BASE_URL are referenced by name in source code
  # (src/lib/ai-agent.ts, scripts/setup-zai-config.js) and in .env.example.
  # The current placeholder value "Z.ai" is NOT a real secret — it's the
  # default in /etc/.z-ai-config that we copied to the Netlify env vars.
  # Netlify's secrets scanner flags any occurrence of the env var's value
  # in source files, which fails the build.
  #
  # GROQ_API_KEY is also added here because the source references Groq's
  # default model name "groq/compound" and base URL — these are public
  # constants, not secrets.
  #
  # When the operator sets real API keys later, they should:
  #   1. Replace placeholder values in Netlify env vars.
  #   2. Remove these keys from SECRETS_SCAN_OMIT_KEYS so the scanner
  #      can catch accidental leaks of the real keys.
  SECRETS_SCAN_OMIT_KEYS = "ZAI_API_KEY,ZAI_BASE_URL,GROQ_API_KEY,GROQ_BASE_URL,GROQ_MODEL"

# Next.js runtime plugin config (auto-installed by Netlify).
# No explicit plugin declaration needed — Netlify's build bot auto-detects
# `next` in package.json and installs the @netlify/nextjs plugin.

[functions]
  node_bundler = "esbuild"
  included_files = ["prisma/schema.prisma", ".z-ai-config"]

# Security headers — additional headers are also set in src/middleware.ts
# but Netlify applies these even for static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "off"
